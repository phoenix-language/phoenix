name: CI

on:
  push:
    branches: [trunk, staging]
  pull_request:
    branches: [trunk, staging]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc
        run: cargo doc --workspace --no-deps

      - name: Test workspace
        run: cargo test --workspace

  cli:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: CLI check fixtures
        run: bash tests/cli/check.sh

      - name: CLI run fixtures
        run: bash tests/cli/run.sh

      - name: CLI build fixtures
        run: bash tests/cli/build.sh

      - name: CLI compile fixtures
        run: bash tests/cli/compile.sh

      - name: CLI help
        run: bash tests/cli/help.sh
